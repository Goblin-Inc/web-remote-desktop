<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebStream Desk</title>
    <style>
        body { margin: 0; background: #111; color: #fff; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; }
        #remoteCanvas { border: 2px solid #333; max-width: 100vw; max-height: 100vh; cursor: crosshair; }
    </style>
</head>
<body>
    <canvas id="remoteCanvas"></canvas>

    <script>
        const canvas = document.getElementById('remoteCanvas');
        const ctx = canvas.getContext('2d');
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${location.host}/ws`);
        ws.binaryType = "arraybuffer";

        ws.onmessage = (event) => {
            if (typeof event.data !== "string") {
                // Получаем байты кадра и рисуем на Canvas
                const blob = new Blob([event.data], { type: 'image/jpeg' });
                const url = URL.createObjectURL(blob);
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                };
                img.src = url;
            }
        };

        // Передача движения мыши
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            ws.send(JSON.stringify({ type: 'mousemove', x: x, y: y }));
        });

        // Передача кликов
        canvas.addEventListener('click', (e) => {
            ws.send(JSON.stringify({ type: 'click', button: e.button }));
        });

        // Передача нажатий клавиш
        window.addEventListener('keydown', (e) => {
            ws.send(JSON.stringify({ type: 'keydown', key: e.key }));
        });
    </script>
</body>
</html>
